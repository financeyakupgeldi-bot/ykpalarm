name: Flutter APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Bağımlılıkları yükle
        working-directory: rsi_alarm
        run: flutter pub get

      - name: APK derle
        working-directory: rsi_alarm
        run: flutter build apk --release

      - name: APK'yı kaydet
        uses: actions/upload-artifact@v4
        with:
          name: RSI-Alarm-APK
          path: rsi_alarm/build/app/outputs/flutter-apk/app-release.apk
